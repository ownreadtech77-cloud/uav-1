<!DOCTYPE html>
<html lang="en">
<head>
    <title>UAV 3D Visualization (with 3D Models)</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; background-color: #111; overflow: hidden; }
        canvas { display: block; }
        #tooltip {
            position: absolute;
            display: none;
            padding: 8px;
            background: rgba(0, 0, 0, 0.75);
            color: white;
            border-radius: 4px;
            pointer-events: none;
            font-family: sans-serif;
            font-size: 12px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="tooltip"></div>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        // Import the 3D model loader
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        let scene, camera, renderer, controls;
        let uav, gbs;
        let users = [];
        let signalLines = [];
        let interactiveObjects = [];

        // For dragging
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const hoverPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -15); // Plane at y=15
        const intersection = new THREE.Vector3();
        let isDragging = false;

        // For hovering
        const hoverRay = new THREE.Raycaster();
        const tooltip = document.getElementById('tooltip');
        let lastHovered = null;

        init();
        animate();

        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);
            scene.fog = new THREE.Fog(0x87ceeb, 50, 250);

            // Camera
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 40, 70);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            // Controls
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.maxPolarAngle = Math.PI / 2.1;

            // Lighting
            const ambLight = new THREE.AmbientLight(0x606060);
            scene.add(ambLight);
            const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
            hemiLight.position.set(0, 100, 0);
            scene.add(hemiLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(30, 50, 30);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            dirLight.shadow.camera.top = 50;
            dirLight.shadow.camera.bottom = -50;
            dirLight.shadow.camera.left = -50;
            dirLight.shadow.camera.right = 50;
            scene.add(dirLight);

            // Ground & Water
            const groundGeo = new THREE.PlaneGeometry(200, 200, 20, 20);
            const groundMat = new THREE.MeshLambertMaterial({ color: 0x559020 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);
            
            const waterGeo = new THREE.PlaneGeometry(200, 80);
            const waterMat = new THREE.MeshStandardMaterial({ color: 0x0066ff, metalness: 0.8, roughness: 0.1, transparent: true, opacity: 0.7 });
            const water = new THREE.Mesh(waterGeo, waterMat);
            water.rotation.x = -Math.PI / 2;
            water.position.set(0, -0.1, -60);
            scene.add(water);

            // --- 1. Load 3D Models ---
            
            // Create a single loader instance
            const loader = new GLTFLoader();

            // Load Inoperative GBS (Using the building model you found)
            loader.load(
                'low_poly_building.glb', // Assumed filename
                function (gltf) {
                    gbs = gltf.scene;
                    gbs.position.set(-30, 0, -20);
                    gbs.scale.set(5, 5, 5); // Adjust scale as needed
                    gbs.userData.name = "Inoperative GBS (Tower)";
                    
                    // Add the Red X to the loaded model
                    const xTexture = createRedXTexture();
                    const xMat = new THREE.MeshBasicMaterial({ map: xTexture, transparent: true, side: THREE.DoubleSide });
                    // Adjust size and position of X to fit your building model
                    const xPlane = new THREE.Mesh(new THREE.PlaneGeometry(8, 8), xMat); 
                    xPlane.position.set(0, 10, 5); // You will need to tweak this
                    gbs.add(xPlane); // Add X as a child of the tower

                    gbs.traverse(obj => { if (obj.isMesh) obj.castShadow = true; });
                    scene.add(gbs);
                    interactiveObjects.push(gbs);
                },
                undefined, // onProgress callback (optional)
                function (error) {
                    console.error('An error happened loading the building:', error);
                    alert('Could not load the GBS model. Check the filename and run on a server.');
                }
            );

            // Load Single UAV (UmBS - Drone)
            loader.load(
                'low_poly_drone_dji_mavic_mini.glb', // Assumed filename
                function (gltf) {
                    uav = gltf.scene;
                    uav.position.set(0, 15, 0); // Start at hover altitude
                    uav.scale.set(2, 2, 2); // Adjust scale as needed
                    uav.userData.name = "UAV (Drone UmBS)";
                    
                    // Add a signal emitter glow
                    const emitterMat = new THREE.MeshStandardMaterial({ color: 0x0077ff, emissive: 0x0077ff, emissiveIntensity: 1 });
                    const emitterGeo = new THREE.SphereGeometry(0.2, 8, 8);
                    const emitter = new THREE.Mesh(emitterGeo, emitterMat);
                    emitter.position.set(0, -0.5, 0); // Adjust position relative to drone model
                    uav.add(emitter);

                    uav.traverse(obj => { if (obj.isMesh) obj.castShadow = true; });
                    scene.add(uav);
                    interactiveObjects.push(uav);
                },
                undefined,
                function (error) {
                    console.error('An error happened loading the drone:', error);
                    alert('Could not load the UAV model. Check the filename and run on a server.');
                }
            );

            // Load Users (UEs - Persons)
            const uePositions = [
                [15, 0, 15], [-10, 0, 10], [20, 0, -5], [-5, 0, -15], [0, 0, 20], [30, 0, 0]
            ];
            loader.load(
                'low_poly_person.glb', // Assumed filename
                function (gltf) {
                    const personModel = gltf.scene;
                    personModel.scale.set(1, 1, 1); // Adjust scale as needed
                    
                    uePositions.forEach((pos, index) => {
                        const person = personModel.clone(); 
                        person.position.set(pos[0], pos[1], pos[2]);
                        person.rotation.y = Math.random() * Math.PI * 2; 
                        person.userData.name = `User ${index + 1}`;
                        
                        person.traverse(obj => { if (obj.isMesh) obj.castShadow = true; });
                        
                        users.push(person);
                        scene.add(person);
                        interactiveObjects.push(person);
                        
                        // Create the signal line *after* the user is created
                        createSignalLine(person);
                    });
                },
                undefined,
                function (error) {
                    console.error('An error happened loading the person:', error);
                    alert('Could not load the person model. Check the filename and run on a server.');
                }
            );

            // Trees (Kept simple to not distract from models)
            for (let i = 0; i < 20; i++) {
                const treeGroup = new THREE.Group();
                const trunkGeo = new THREE.CylinderGeometry(0.3, 0.4, 4, 6);
                const trunkMat = new THREE.MeshLambertMaterial({ color: 0x8B4513 });
                const trunk = new THREE.Mesh(trunkGeo, trunkMat);
                trunk.position.y = 2;
                treeGroup.add(trunk);
                const foliageGeo = new THREE.ConeGeometry(2.5, 6, 8);
                const foliageMat = new THREE.MeshLambertMaterial({ color: 0x228B22 });
                const foliage = new THREE.Mesh(foliageGeo, foliageMat);
                foliage.position.y = 4 + 3;
                treeGroup.add(foliage);
                let x = Math.random() * 160 - 80;
                let z = Math.random() * 160 - 80;
                if (z > -20 && z < 20) z = 20 + Math.random() * 60; 
                treeGroup.position.set(x, 0, z);
                treeGroup.traverse(obj => { if (obj.isMesh) obj.castShadow = true; });
                treeGroup.userData.name = "Tree";
                scene.add(treeGroup);
                interactiveObjects.push(treeGroup);
            }
            
            // Event Listeners
            window.addEventListener('resize', onWindowResize);
            renderer.domElement.addEventListener('mousedown', onMouseDown);
            renderer.domElement.addEventListener('mousemove', onMouseMove);
            renderer.domElement.addEventListener('mouseup', onMouseUp);
        }

        // --- 2. Interactivity Logic (Rays) ---
        function createSignalLine(user) {
            const lineMat = new THREE.LineBasicMaterial({ 
                color: 0x00aaff, 
                linewidth: 2, 
                transparent: true, 
                opacity: 0.7 
            });
            
            // Adjust this '1.5' to match the height of your person model
            const userHeadPos = user.position.clone().add(new THREE.Vector3(0, 1.5, 0)); 
            const points = [new THREE.Vector3(0, 15, 0), userHeadPos]; 
            const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
            const line = new THREE.Line(lineGeo, lineMat.clone());
            
            signalLines.push(line);
            scene.add(line);
        }

        // Helper function to create a CanvasTexture with a red X
        function createRedXTexture() {
            const size = 128;
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const context = canvas.getContext('2d');
            context.fillStyle = 'rgba(200, 0, 0, 0.7)';
            context.fillRect(0, 0, size, size);
            context.strokeStyle = 'white';
            context.lineWidth = 15;
            context.beginPath();
            context.moveTo(15, 15);
            context.lineTo(size - 15, size - 15);
            context.moveTo(size - 15, 15);
            context.lineTo(15, size - 15);
            context.stroke();
            return new THREE.CanvasTexture(canvas);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- Dragging Logic ---
        function onMouseDown(event) {
            if (!uav) return; // Don't do anything if UAV isn't loaded

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            const intersects = raycaster.intersectObject(uav, true);
            if (intersects.length > 0) {
                isDragging = true;
                controls.enabled = false;
            }
        }

        function onMouseMove(event) {
            const mX = event.clientX;
            const mY = event.clientY;
            mouse.x = (mX / window.innerWidth) * 2 - 1;
            mouse.y = -(mY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            if (isDragging && uav) { 
                if (raycaster.ray.intersectPlane(hoverPlane, intersection)) {
                    uav.position.copy(intersection);
                }
            } 
            else { // Hover Logic
                hoverRay.setFromCamera(mouse, camera);
                const intersects = hoverRay.intersectObjects(interactiveObjects, true); 
                
                if (intersects.length > 0) {
                    let hoveredObj = intersects[0].object;
                    while (hoveredObj.parent && !hoveredObj.userData.name) {
                        hoveredObj = hoveredObj.parent;
                    }
                    if (lastHovered !== hoveredObj && hoveredObj.userData.name) {
                        lastHovered = hoveredObj;
                        tooltip.style.display = 'block';
                        tooltip.textContent = hoveredObj.userData.name;
                    }
                    tooltip.style.left = (mX + 10) + 'px';
                    tooltip.style.top = (mY + 10) + 'px';
                } else {
                    if (lastHovered) {
                        tooltip.style.display = 'none';
                        lastHovered = null;
                    }
                }
            }
        }

        function onMouseUp() {
            isDragging = false;
            controls.enabled = true;
        }

        // --- Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now();
            
            if (uav) { // Only animate if UAV is loaded
                // UAV Hover animation
                uav.position.y = 15 + Math.sin(time * 0.0015) * 0.7;
                hoverPlane.set(new THREE.Vector3(0, 1, 0), -uav.position.y);

                // Dynamic Rays update
                const uavPos = uav.position;
                signalLines.forEach((line, index) => {
                    const positions = line.geometry.attributes.position.array;
                    positions[0] = uavPos.x;
                    positions[1] = uavPos.y;
                    positions[2] = uavPos.z;
                    line.geometry.attributes.position.needsUpdate = true;
                    
                    // Signal Pulse animation
                    line.material.opacity = 0.6 + Math.sin(time * 0.003 + index) * 0.3;
                });
            }

            controls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
