<!DOCTYPE html>
<html lang="en">
<head>
    <title>UAV 3D Visualization (Interactive Users)</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; background-color: #111; overflow: hidden; }
        canvas { display: block; }
        #tooltip {
            position: absolute;
            display: none;
            padding: 8px;
            background: rgba(0, 0, 0, 0.75);
            color: white;
            border-radius: 4px;
            pointer-events: none;
            font-family: sans-serif;
            font-size: 12px;
            z-index: 100;
        }
        #ui-controls {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            z-index: 100;
        }
        #ui-controls button {
            width: 30px;
            height: 30px;
            font-size: 20px;
            font-weight: bold;
            margin: 0 5px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
        }
        #user-count {
            color: white;
            font-family: sans-serif;
            font-size: 16px;
            margin: 0 10px;
            min-width: 80px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="tooltip"></div>
    
    <div id="ui-controls">
        <button id="remove-user" title="Remove User">-</button>
        <div id="user-count">6 Users</div>
        <button id="add-user" title="Add User">+</button>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let scene, camera, renderer, controls;
        let uav, gbs;
        let users = [];
        let signalLines = [];
        let gbsToUavLine; 
        let interactiveObjects = [];

        // Drag Logic
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const hoverPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -15); // For UAV
        const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0); // For Users
        const intersection = new THREE.Vector3();
        let isDragging = false;
        let draggedObject = null; 

        // Hover Logic
        const hoverRay = new THREE.Raycaster();
        const tooltip = document.getElementById('tooltip');
        let lastHovered = null;

        // UI Elements
        const userCountLabel = document.getElementById('user-count');

        init();
        animate();

        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);
            scene.fog = new THREE.Fog(0x87ceeb, 50, 250);

            // Camera
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 40, 70);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            // Controls
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.maxPolarAngle = Math.PI / 2.1;

            // Lighting
            const ambLight = new THREE.AmbientLight(0x606060);
            scene.add(ambLight);
            const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
            hemiLight.position.set(0, 100, 0);
            scene.add(hemiLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(30, 50, 30);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            scene.add(dirLight);

            // Ground & Water
            const groundGeo = new THREE.PlaneGeometry(200, 200, 20, 20);
            const groundMat = new THREE.MeshLambertMaterial({ color: 0x559020 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);
            
            const waterGeo = new THREE.PlaneGeometry(200, 80);
            const waterMat = new THREE.MeshStandardMaterial({ color: 0x0066ff, metalness: 0.8, roughness: 0.1, transparent: true, opacity: 0.7 });
            const water = new THREE.Mesh(waterGeo, waterMat);
            water.rotation.x = -Math.PI / 2;
            water.position.set(0, -0.1, -60);
            scene.add(water);

            // --- 1. Create Models from Code ---

            // Inoperative GBS (Base Station)
            gbs = createGbsBaseStation(); // Using the new function
            gbs.position.set(-30, 0, -20);
            gbs.userData.name = "Base Station"; // Updated name
            scene.add(gbs);
            interactiveObjects.push(gbs);

            // Single UAV (UmBS - Drone)
            uav = createDrone();
            uav.position.set(0, 15, 0); 
            uav.userData.name = "UAV (Drone)";
            scene.add(uav);
            interactiveObjects.push(uav);

            // Users (UEs - Persons)
            const uePositions = [
                [15, 0, 15], [-10, 0, 10], [20, 0, -5], [-5, 0, -15], [0, 0, 20], [30, 0, 0]
            ];
            uePositions.forEach((pos, index) => {
                addUser(new THREE.Vector3(pos[0], pos[1], pos[2]));
            });
            updateUserCount();

            // Create Tower-to-UAV Ray (Red)
            const gbsTopPos = gbs.position.clone().add(new THREE.Vector3(0, 34.5, 0)); // Point to top of new antenna
            const gbsRayMat = new THREE.LineBasicMaterial({
                color: 0xff0000, // Red
                linewidth: 3,
                transparent: true,
                opacity: 0.8
            });
            const gbsRayPoints = [gbsTopPos, uav.position.clone()];
            const gbsRayGeo = new THREE.BufferGeometry().setFromPoints(gbsRayPoints);
            gbsToUavLine = new THREE.Line(gbsRayGeo, gbsRayMat);
            scene.add(gbsToUavLine);

            // Buildings (Town-like)
            const buildingPositions = [
                [40, 0, 40], [-40, 0, 30], [20, 0, -30], [-10, 0, 40], [50, 0, -10], [-50, 0, -40], [45, 0, 10]
            ];
            buildingPositions.forEach((pos, index) => {
                const building = createBuilding();
                building.position.set(pos[0], pos[1], pos[2]);
                building.userData.name = `Building ${index + 1}`;
                scene.add(building);
                interactiveObjects.push(building);
            });

            // Trees
            for (let i = 0; i < 20; i++) {
                const tree = createTree();
                let x = Math.random() * 160 - 80;
                let z = Math.random() * 160 - 80;
                if (z > -20 && z < 20) z = 20 + Math.random() * 60; 
                tree.position.set(x, 0, z);
                tree.userData.name = "Tree";
                scene.add(tree);
                interactiveObjects.push(tree);
            }
            
            // Event Listeners
            window.addEventListener('resize', onWindowResize);
            renderer.domElement.addEventListener('mousedown', onMouseDown);
            renderer.domElement.addEventListener('mousemove', onMouseMove);
            renderer.domElement.addEventListener('mouseup', onMouseUp);
            document.getElementById('add-user').addEventListener('click', () => addUser());
            document.getElementById('remove-user').addEventListener('click', removeUser);
        }

        // --- Helper Functions to Create Models ---

        function createDrone() {
            const droneGroup = new THREE.Group();
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.8, roughness: 0.3 });
            const bodyGeo = new THREE.BoxGeometry(3, 0.5, 2.5);
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.castShadow = true;
            droneGroup.add(body);
            const armMat = new THREE.MeshStandardMaterial({ color: 0x555555 });
            const armGeo = new THREE.CylinderGeometry(0.1, 0.1, 4, 6);
            const arm1 = new THREE.Mesh(armGeo, armMat);
            arm1.rotation.y = Math.PI / 4;
            arm1.rotation.z = Math.PI / 2;
            arm1.position.x = 2;
            arm1.castShadow = true;
            droneGroup.add(arm1);
            const arm2 = new THREE.Mesh(armGeo, armMat);
            arm2.rotation.y = -Math.PI / 4;
            arm2.rotation.z = Math.PI / 2;
            arm2.position.x = -2;
            arm2.castShadow = true;
            droneGroup.add(arm2);
            const emitterMat = new THREE.MeshStandardMaterial({ color: 0x00aaff, emissive: 0x00aaff, emissiveIntensity: 1 });
            const emitterGeo = new THREE.SphereGeometry(0.3, 8, 8);
            const emitter = new THREE.Mesh(emitterGeo, emitterMat);
            emitter.position.y = -0.5;
            droneGroup.add(emitter);
            return droneGroup;
        }

        // --- NEW, IMPROVED BASE STATION FUNCTION ---
        function createGbsBaseStation() {
            const towerGroup = new THREE.Group();
            const baseMat = new THREE.MeshStandardMaterial({ color: 0xbbbbbb, roughness: 0.7 });
            const darkMat = new THREE.MeshStandardMaterial({ color: 0x666666, roughness: 0.5 });
            
            // Create a solid building base
            const baseGeo = new THREE.BoxGeometry(10, 8, 10);
            const baseBuilding = new THREE.Mesh(baseGeo, baseMat);
            baseBuilding.position.y = 4; // Sits on the ground
            baseBuilding.castShadow = true;
            baseBuilding.receiveShadow = true;
            towerGroup.add(baseBuilding);

            // Add a "door"
            const doorGeo = new THREE.PlaneGeometry(1.5, 3);
            const doorMat = new THREE.MeshStandardMaterial({ color: 0x444444 });
            const door = new THREE.Mesh(doorGeo, doorMat);
            door.position.set(0, 1.5, 5.01); // On the front face
            towerGroup.add(door);

            // Create a shorter lattice tower on top of the building
            const towerMat = new THREE.MeshStandardMaterial({ color: 0x999999, roughness: 0.6 });
            const legGeo = new THREE.BoxGeometry(0.4, 20, 0.4); // Shorter legs
            const leg1 = new THREE.Mesh(legGeo, towerMat); leg1.position.set(1.5, 18, 1.5); towerGroup.add(leg1); // 8 (base) + 10 (half leg)
            const leg2 = new THREE.Mesh(legGeo, towerMat); leg2.position.set(-1.5, 18, 1.5); towerGroup.add(leg2);
            const leg3 = new THREE.Mesh(legGeo, towerMat); leg3.position.set(1.5, 18, -1.5); towerGroup.add(leg3);
            const leg4 = new THREE.Mesh(legGeo, towerMat); leg4.position.set(-1.5, 18, -1.5); towerGroup.add(leg4);

            // Simplified lattice
            const trussGeo = new THREE.BoxGeometry(0.2, 0.2, 3); 
            for (let y = 12; y < 28; y += 4) {
                const h1 = new THREE.Mesh(trussGeo, towerMat); h1.position.set(0, y, 1.5); towerGroup.add(h1);
                const h2 = new THREE.Mesh(trussGeo, towerMat); h2.position.set(0, y, -1.5); towerGroup.add(h2);
                const h3 = new THREE.Mesh(trussGeo, towerMat); h3.rotation.y = Math.PI / 2; h3.position.set(1.5, y, 0); towerGroup.add(h3);
                const h4 = new THREE.Mesh(trussGeo, towerMat); h4.rotation.y = Math.PI / 2; h4.position.set(-1.5, y, 0); towerGroup.add(h4);
            }

            // Top platform with Antennas
            const topGeo = new THREE.BoxGeometry(4, 1.5, 4);
            const top = new THREE.Mesh(topGeo, darkMat);
            top.position.y = 28.75; // 8 (base) + 20 (legs) + 0.75 (half top)
            top.castShadow = true;
            towerGroup.add(top);

            // Main antenna
            const antennaGeo = new THREE.CylinderGeometry(0.1, 0.1, 5, 8);
            const antenna = new THREE.Mesh(antennaGeo, darkMat);
            antenna.position.y = 32; // On top of the platform
            towerGroup.add(antenna);

            // "Dish" antenna
            const dishGeo = new THREE.CylinderGeometry(1, 1, 0.3, 16);
            const dish = new THREE.Mesh(dishGeo, darkMat);
            dish.position.set(1.5, 29.5, 0);
            dish.rotation.z = Math.PI / 4;
            towerGroup.add(dish);
            
            // "Panel" antenna
            const panelGeo = new THREE.BoxGeometry(0.2, 1.5, 1);
            const panel = new THREE.Mesh(panelGeo, darkMat);
            panel.position.set(-1.5, 29.5, 0);
            towerGroup.add(panel);

            // ** Red X is removed. **

            towerGroup.traverse(obj => { if (obj.isMesh) obj.castShadow = true; });
            return towerGroup;
        }

        function createPerson() {
            const personGroup = new THREE.Group();
            const headMat = new THREE.MeshLambertMaterial({ color: 0xffdbac });
            const headGeo = new THREE.SphereGeometry(0.3, 8, 8);
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 2.3;
            head.castShadow = true;
            personGroup.add(head);
            const bodyMat = new THREE.MeshLambertMaterial({ color: new THREE.Color().setHSL(Math.random(), 0.7, 0.5) });
            const bodyGeo = new THREE.CylinderGeometry(0.4, 0.3, 1, 8);
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 1.5;
            body.castShadow = true;
            personGroup.add(body);
            const legsMat = new THREE.MeshLambertMaterial({ color: 0x444488 });
            const legGeo = new THREE.CylinderGeometry(0.2, 0.15, 1, 6);
            const leg1 = new THREE.Mesh(legGeo, legsMat);
            leg1.position.set(0.2, 0.5, 0);
            leg1.castShadow = true;
            personGroup.add(leg1);
            const leg2 = new THREE.Mesh(legGeo, legsMat);
            leg2.position.set(-0.2, 0.5, 0);
            leg2.castShadow = true;
            personGroup.add(leg2);
            return personGroup;
        }

        function createBuilding() {
            const buildingGroup = new THREE.Group();
            const floorCount = Math.floor(Math.random() * 3) + 2;
            let currentHeight = 0;
            for (let i = 0; i < floorCount; i++) {
                const floorWidth = Math.random() * 5 + 8;
                const floorDepth = Math.random() * 5 + 8;
                const floorHeight = Math.random() * 2 + 3;
                const floorGeo = new THREE.BoxGeometry(floorWidth, floorHeight, floorDepth);
                const floorMat = new THREE.MeshStandardMaterial({
                    color: new THREE.Color().setHSL(Math.random(), 0.5, 0.6),
                    roughness: 0.8,
                });
                const floor = new THREE.Mesh(floorGeo, floorMat);
                floor.position.y = currentHeight + floorHeight / 2;
                floor.castShadow = true;
                floor.receiveShadow = true;
                buildingGroup.add(floor);
                currentHeight += floorHeight;
            }
            return buildingGroup;
        }

        function createTree() {
            const treeGroup = new THREE.Group();
            const trunkGeo = new THREE.CylinderGeometry(0.3, 0.4, 4, 6);
            const trunkMat = new THREE.MeshLambertMaterial({ color: 0x8B4513 });
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.y = 2;
            trunk.castShadow = true;
            treeGroup.add(trunk);
            const foliageGeo = new THREE.ConeGeometry(2.5, 6, 8);
            const foliageMat = new THREE.MeshLambertMaterial({ color: 0x228B22 });
            const foliage = new THREE.Mesh(foliageGeo, foliageMat);
            foliage.position.y = 4 + 3;
            foliage.castShadow = true;
            treeGroup.add(foliage);
            return treeGroup;
        }

        // --- Add/Remove User Functions ---
        
        function updateUserCount() {
            userCountLabel.textContent = `${users.length} User${users.length !== 1 ? 's' : ''}`;
        }

        function addUser(position) {
            const person = createPerson();
            
            if (!position) {
                position = new THREE.Vector3(
                    Math.random() * 80 - 40,
                    0,
                    Math.random() * 80 - 40
                );
            }
            person.position.copy(position);
            person.userData.name = `User ${users.length + 1}`;
            
            users.push(person);
            scene.add(person);
            interactiveObjects.push(person);

            createSignalLine(person);
            updateUserCount();
        }

        function removeUser() {
            if (users.length === 0) return;

            const person = users.pop();
            const line = signalLines.pop();

            scene.remove(person);
            scene.remove(line);

            const index = interactiveObjects.indexOf(person);
            if (index > -1) {
                interactiveObjects.splice(index, 1);
            }

            line.geometry.dispose();
            line.material.dispose();
            person.traverse(obj => {
                if (obj.isMesh) {
                    obj.geometry.dispose();
                    obj.material.dispose();
                }
            });

            updateUserCount();
        }


        // --- Interactivity Logic ---

        function createSignalLine(user) {
            const lineMat = new THREE.LineBasicMaterial({ 
                color: 0x00aaff, 
                linewidth: 2, 
                transparent: true, 
                opacity: 0.7 
            });
            
            const userHeadPos = user.position.clone().add(new THREE.Vector3(0, 2.3, 0)); 
            const points = [uav.position.clone(), userHeadPos]; 
            const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
            const line = new THREE.Line(lineGeo, lineMat.clone());
            
            signalLines.push(line);
            scene.add(line);
        }

        function createRedXTexture() {
            // This function is no longer used, but we can leave it
            // in case you want to add an X somewhere else.
            const size = 128;
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const context = canvas.getContext('2d');
            context.fillStyle = 'rgba(200, 0, 0, 0.7)';
            context.fillRect(0, 0, size, size);
            context.strokeStyle = 'white';
            context.lineWidth = 15;
            context.beginPath();
            context.moveTo(15, 15);
            context.lineTo(size - 15, size - 15);
            context.moveTo(size - 15, 15);
            context.lineTo(15, size - 15);
            context.stroke();
            return new THREE.CanvasTexture(canvas);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- Dragging Logic ---
        function onMouseDown(event) {
            if (!uav) return; 

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            const intersects = raycaster.intersectObjects(interactiveObjects, true);
            
            if (intersects.length > 0) {
                let hoveredObj = intersects[0].object;
                while (hoveredObj.parent && !hoveredObj.userData.name) {
                    hoveredObj = hoveredObj.parent;
                }
                
                if (hoveredObj === uav || users.includes(hoveredObj)) {
                    isDragging = true;
                    draggedObject = hoveredObj;
                    controls.enabled = false;
                }
            }
        }

        function onMouseMove(event) {
            const mX = event.clientX;
            const mY = event.clientY;
            mouse.x = (mX / window.innerWidth) * 2 - 1;
            mouse.y = -(mY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            if (isDragging && draggedObject) { 
                if (draggedObject === uav) {
                    if (raycaster.ray.intersectPlane(hoverPlane, intersection)) {
                        uav.position.copy(intersection);
                    }
                } else if (users.includes(draggedObject)) {
                    if (raycaster.ray.intersectPlane(groundPlane, intersection)) {
                        draggedObject.position.copy(intersection);
                    }
                }
            } 
            else { 
                // Hover logic
                hoverRay.setFromCamera(mouse, camera);
                const intersects = hoverRay.intersectObjects(interactiveObjects, true); 
                
                if (intersects.length > 0) {
                    let hoveredObj = intersects[0].object;
                    while (hoveredObj.parent && !hoveredObj.userData.name) {
                        hoveredObj = hoveredObj.parent;
                    }
                    if (lastHovered !== hoveredObj && hoveredObj.userData.name) {
                        lastHovered = hoveredObj;
                        tooltip.style.display = 'block';
                        tooltip.textContent = hoveredObj.userData.name;
                    }
                    tooltip.style.left = (mX + 10) + 'px';
                    tooltip.style.top = (mY + 10) + 'px';
                } else {
                    if (lastHovered) {
                        tooltip.style.display = 'none';
                        lastHovered = null;
                    }
                }
            }
        }

        function onMouseUp() {
            isDragging = false;
            draggedObject = null; 
            controls.enabled = true;
        }

        // --- Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now();
            
            if (uav) {
                if (!isDragging || draggedObject !== uav) { 
                    uav.position.y = 15 + Math.sin(time * 0.0015) * 0.7;
                    hoverPlane.set(new THREE.Vector3(0, 1, 0), -uav.position.y);
                }

                const uavPos = uav.position;

                // Update UAV-to-User lines
                signalLines.forEach((line, index) => {
                    const user = users[index];
                    if (!user) return; 

                    const userHeadPos = user.position.clone().add(new THREE.Vector3(0, 2.3, 0));
                    const positions = line.geometry.attributes.position.array;
                    
                    positions[0] = uavPos.x;
                    positions[1] = uavPos.y;
                    positions[2] = uavPos.z;
                    
                    positions[3] = userHeadPos.x;
                    positions[4] = userHeadPos.y;
                    positions[5] = userHeadPos.z;

                    line.geometry.attributes.position.needsUpdate = true;
                    line.material.opacity = 0.6 + Math.sin(time * 0.003 + index) * 0.3;
                });

                // Update Tower-to-UAV line
                if (gbsToUavLine) {
                    const positions = gbsToUavLine.geometry.attributes.position.array;
                    positions[3] = uavPos.x; 
                    positions[4] = uavPos.y; 
                    positions[5] = uavPos.z; 
                    gbsToUavLine.geometry.attributes.position.needsUpdate = true;
                    gbsToUavLine.material.opacity = 0.5 + Math.cos(time * 0.002) * 0.3;
                }
            }

            controls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
